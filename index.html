<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon GO GPX Routes</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #e2e5ea;
      --text: #1c1f26;
      --muted: #6b7280;
      --accent: #e3350d;      /* Poké-red */
      --accent-soft: #fdecea;
      --track: #2f6fed;
      --start: #16a34a;
      --end: #e3350d;
      --city: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a;
        --panel: #1a1d25;
        --border: #2a2e38;
        --text: #e7e9ee;
        --muted: #9aa1ad;
        --accent: #ff5a3c;
        --accent-soft: #3a1f1a;
        --track: #6ea8ff;
        --start: #34d17b;
        --end: #ff5a3c;
        --city: #f59e0b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 100%;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    header .sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }
    .search {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .search input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .search input:focus { outline: 2px solid var(--track); outline-offset: -1px; }
    #list { overflow-y: auto; flex: 1; padding: 6px 0 14px; min-height: 0; }
    .country {
      padding: 12px 18px 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .route {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 18px;
      cursor: pointer;
      font-size: 13px;
      border-left: 3px solid transparent;
    }
    .route:hover { background: var(--bg); }
    .route.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .route .end { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .route .meta { font-size: 11px; color: var(--muted); }
    .route .copy {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .route:hover .copy, .route.active .copy, .route .copy:focus-visible { opacity: 1; }
    /* Touch devices have no hover — always show the copy button there. */
    @media (hover: none) { .route .copy { opacity: 1; } }
    .route .copy:hover { border-color: var(--accent); color: var(--accent); }
    .route .copy.done { border-color: var(--start); color: var(--start); opacity: 1; }
    .route .tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--city);
      border: 1px solid var(--city);
      border-radius: 999px;
      padding: 0 6px;
      line-height: 15px;
    }
    .route.hidden { display: none; }
    .country.hidden { display: none; }
    .popup-copy {
      margin-top: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .popup-copy:hover { border-color: var(--accent); color: var(--accent); }
    .popup-copy.done { border-color: var(--start); color: var(--start); }
    #toast {
      position: absolute;
      z-index: 1200;
      bottom: 18px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--text);
      color: var(--panel);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #map { height: 100%; width: 100%; background: var(--bg); }
    footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }
    footer a { color: var(--track); }
    #banner {
      display: none;
      position: absolute;
      z-index: 1000;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      max-width: 620px;
      background: var(--accent-soft);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    }
    #banner code {
      background: rgba(127,127,127,0.18);
      padding: 1px 5px; border-radius: 4px;
      font-size: 12px;
    }
    .map-wrap { position: relative; min-width: 0; }
    .leaflet-popup-content { font-size: 13px; }
    .leaflet-popup-content b { font-size: 14px; }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
      #sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Pokémon GO GPX Routes</h1>
      <div class="sub" id="count">Loading routes…</div>
    </header>
    <div class="search">
      <input id="filter" type="search" placeholder="Filter routes & cities…" autocomplete="off" />
    </div>
    <div id="list"></div>
    <footer>
      Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
      Click a route or city to zoom.
    </footer>
  </aside>

  <div class="map-wrap">
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="map"></div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    // Route files, relative to this page. Static hosting cannot list a directory,
    // so the paths live here, but each route's name and country are read from the
    // GPX metadata (<trk><name> and <trk><desc>) when it loads — the GPX files are
    // the source of truth. When you add or remove a route, update this list.
    const ROUTE_FILES = [
      "Australia/Kings Park, Perth, Western Australia.gpx",
      "Australia/Melbourne Zoo, Melbourne, Victoria.gpx",
      "Australia/Royal Botanic Gardens, Sydney, New South Wales.gpx",
      "Austria/Stadtpark, Vienna.gpx",
      "Brazil/Ibirapuera Park, São Paulo.gpx",
      "Canada/Assiniboine Park Zoo, Winnipeg, Manitoba.gpx",
      "Canada/Jardin Botanique, Montreal, Quebec.gpx",
      "Denmark/Fisketorvet, Copenhagen.gpx",
      "England/Chester Zoo, Chester, Cheshire.gpx",
      "France/Pere Lachaise Cemetery, Paris.gpx",
      "Germany/Friedrichsau, Ulm, Baden-Württemberg.gpx",
      "Germany/Schlossgarten, Schwetzingen, Baden-Württemberg.gpx",
      "Germany/Westfalenpark, Dortmund, North Rhine-Westphalia.gpx",
      "Germany/Westpark, Munich, Bavaria.gpx",
      "Hungary/Margaret Island Alternate Route, Budapest.gpx",
      "Hungary/Margaret Island, Budapest.gpx",
      "Japan/Hibiya Park, Tokyo.gpx",
      "Japan/Igashira Park, Moka, Tochigi.gpx",
      "Japan/Morioka Castle Ruins Park, Morioka, Iwate.gpx",
      "Japan/Nagai Park, Osaka.gpx",
      "Japan/Ueno Park, Tokyo.gpx",
      "New Zealand/Ashburton Domain, Ashburton, Canterbury.gpx",
      "New Zealand/Botanic Garden, Wellington.gpx",
      "South Korea/Starfield COEX Mall, Seoul.gpx",
      "Spain/Parque San Pablo, Zaragoza, Aragon.gpx",
      "Spain/Parque de María Luisa, Seville, Andalusia.gpx",
      "Spain/Plaza Lucas Miret Rodríguez, Zaragoza, Aragon.gpx",
      "United Arab Emirates/The Walk, Dubai.gpx",
      "United States/Centennial Park, Ellicott City, Maryland.gpx",
      "United States/Central Park, New York City, New York.gpx",
      "United States/Golden Gate Bridge, San Francisco, California.gpx",
      "United States/Honolulu Downtown, Honolulu, Hawaii.gpx",
      "United States/LA Zoo, Los Angeles, California.gpx",
      "United States/Lebanon Hills, Eagan, Minnesota.gpx",
      "United States/Memorial Park, Houston, Texas.gpx",
      "United States/Navy Pier, Chicago, Illinois.gpx",
      "United States/Pier 39, San Francisco, California.gpx",
      "United States/River Park, New York City, New York.gpx",
      "United States/Slater Memorial Park, Pawtucket, Rhode Island.gpx",
    ];

    // Path-derived fallback for each file — used only when a route is missing
    // its <trk><name>/<desc> metadata or fails to load. Real values come from
    // the GPX metadata and overwrite these in init().
    const ROUTES = ROUTE_FILES.map((file) => {
      const slash = file.lastIndexOf("/");
      return { file, country: file.slice(0, slash), name: file.slice(slash + 1).replace(/\.gpx$/i, "") };
    });

    const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

    const map = L.map("map", { worldCopyJump: true }).setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const filterEl = document.getElementById("filter");
    const bannerEl = document.getElementById("banner");
    const toastEl = document.getElementById("toast");

    const store = []; // { name, country, file, gpx, latlngs, line, el, markers, distance }
    const cityStore = []; // { city, country, coords:[lat,lon], coordStr, marker, el }
    let active = null;
    let activeCity = null;
    let toastTimer = null;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    // Copy text to the clipboard, falling back to execCommand for insecure
    // contexts (e.g. served over plain http, where the async Clipboard API is
    // unavailable). Returns a promise that resolves to true on success.
    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) { /* fall through to legacy path */ }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    async function copyRoute(entry, btn) {
      const ok = await copyText(entry.gpx);
      if (btn) {
        const original = btn.textContent;
        btn.textContent = ok ? "Copied" : "Failed";
        btn.classList.add("done");
        setTimeout(() => { btn.textContent = original; btn.classList.remove("done"); }, 1400);
      }
      toast(ok ? `Copied “${entry.name}” GPX to clipboard` : "Copy failed");
    }

    function haversine(a, b) {
      const R = 6371000, toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
      const s = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }
    function routeDistance(latlngs) {
      let d = 0;
      for (let i = 1; i < latlngs.length; i++) d += haversine(latlngs[i - 1], latlngs[i]);
      return d;
    }
    function fmtDist(m) {
      return m >= 1000 ? (m / 1000).toFixed(2) + " km" : Math.round(m) + " m";
    }

    async function loadGpx(route) {
      const res = await fetch(encodeURI(route.file));
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text, "application/xml");
      if (doc.querySelector("parsererror")) throw new Error("XML parse error");
      const pts = doc.getElementsByTagName("trkpt");
      const latlngs = [];
      for (const p of pts) {
        const lat = parseFloat(p.getAttribute("lat"));
        const lon = parseFloat(p.getAttribute("lon"));
        if (Number.isFinite(lat) && Number.isFinite(lon)) latlngs.push([lat, lon]);
      }
      const nameEl = doc.querySelector("trk > name");
      const descEl = doc.querySelector("trk > desc");
      const name = nameEl ? nameEl.textContent.trim() : "";
      const desc = descEl ? descEl.textContent.trim() : "";
      return { latlngs, text, name, desc };
    }

    // Load large cities from Large Cities.gpx, which holds each city as a named
    // GPX waypoint (<wpt> with <name> = city and <desc> = country). Returns
    // [{country, city, coords, coordStr}]; coordStr preserves the file's exact
    // lat/lon text for copying.
    async function loadCities() {
      const res = await fetch(encodeURI("Large Cities.gpx"));
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      const doc = new DOMParser().parseFromString(await res.text(), "application/xml");
      if (doc.querySelector("parsererror")) throw new Error("XML parse error");
      const cities = [];
      for (const w of doc.getElementsByTagName("wpt")) {
        const latStr = w.getAttribute("lat"), lonStr = w.getAttribute("lon");
        const lat = parseFloat(latStr), lon = parseFloat(lonStr);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        const nameEl = w.getElementsByTagName("name")[0];
        const descEl = w.getElementsByTagName("desc")[0];
        cities.push({
          country: descEl ? descEl.textContent.trim() : "Other",
          city: nameEl ? nameEl.textContent.trim() : `${lat}, ${lon}`,
          coords: [lat, lon],
          coordStr: `${latStr},${lonStr}`,
        });
      }
      return cities;
    }

    function clearMarkers(entry) {
      if (entry.markers) { entry.markers.forEach((m) => map.removeLayer(m)); entry.markers = null; }
    }

    function selectRoute(entry, { pan = true } = {}) {
      deselectCity();
      if (active && active !== entry) {
        active.line.setStyle({ color: cssVar("--track"), weight: 2, opacity: 0.55 });
        active.line.bringToBack();
        clearMarkers(active);
        active.el.classList.remove("active");
      }
      active = entry;
      entry.el.classList.add("active");
      entry.line.setStyle({ color: cssVar("--accent"), weight: 4, opacity: 1 });
      entry.line.bringToFront();

      clearMarkers(entry);
      const a = entry.latlngs[0], b = entry.latlngs[entry.latlngs.length - 1];
      const dot = (color) => L.circleMarker(a, {
        radius: 6, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1,
      });
      const start = L.circleMarker(a, { radius: 6, color: "#fff", weight: 2, fillColor: cssVar("--start"), fillOpacity: 1 }).bindTooltip("Start");
      const end = L.circleMarker(b, { radius: 6, color: "#fff", weight: 2, fillColor: cssVar("--end"), fillOpacity: 1 }).bindTooltip("End");
      entry.markers = [start.addTo(map), end.addTo(map)];

      const popup = document.createElement("div");
      const title = document.createElement("b");
      title.textContent = entry.name;
      const info = document.createElement("div");
      info.textContent = `${entry.country} · ${entry.latlngs.length} points · ${fmtDist(entry.distance)}`;
      const pCopy = document.createElement("button");
      pCopy.className = "popup-copy";
      pCopy.type = "button";
      pCopy.textContent = "Copy GPX";
      pCopy.addEventListener("click", () => copyRoute(entry, pCopy));
      popup.append(title, info, pCopy);
      entry.line.bindPopup(popup);
      if (pan) {
        map.fitBounds(entry.line.getBounds(), { padding: [40, 40], maxZoom: 17 });
        entry.line.openPopup();
      }
      entry.el.scrollIntoView({ block: "nearest" });
    }

    function deselectCity() {
      if (!activeCity) return;
      activeCity.marker.setStyle({ radius: 5, fillColor: cssVar("--city") });
      activeCity.el.classList.remove("active");
      activeCity = null;
    }

    function selectCity(c, { pan = true } = {}) {
      // Clear any active route selection so only one thing is highlighted.
      if (active) {
        active.line.setStyle({ color: cssVar("--track"), weight: 2, opacity: 0.55 });
        active.line.bringToBack();
        clearMarkers(active);
        active.el.classList.remove("active");
        active = null;
      }
      deselectCity();
      activeCity = c;
      c.el.classList.add("active");
      c.marker.setStyle({ radius: 8, fillColor: cssVar("--accent") });
      c.marker.bringToFront();

      const popup = document.createElement("div");
      const title = document.createElement("b");
      title.textContent = c.city;
      const info = document.createElement("div");
      info.textContent = `${c.country} · ${c.coordStr}`;
      const btn = document.createElement("button");
      btn.className = "popup-copy";
      btn.type = "button";
      btn.textContent = "Copy coordinates";
      btn.addEventListener("click", () => copyCoords(c, btn));
      popup.append(title, info, btn);
      c.marker.bindPopup(popup);

      if (pan) {
        map.setView(c.coords, Math.max(map.getZoom(), 12));
        c.marker.openPopup();
      }
      c.el.scrollIntoView({ block: "nearest" });
    }

    async function copyCoords(c, btn) {
      const ok = await copyText(c.coordStr);
      if (btn) {
        const original = btn.textContent;
        btn.textContent = ok ? "Copied" : "Failed";
        btn.classList.add("done");
        setTimeout(() => { btn.textContent = original; btn.classList.remove("done"); }, 1400);
      }
      toast(ok ? `Copied ${c.city} coordinates to clipboard` : "Copy failed");
    }

    function buildRouteRow(r, country) {
      const entry = store.find((s) => s.file === r.file);
      const el = document.createElement("div");
      el.className = "route";
      el.dataset.country = country;
      el.dataset.name = r.name.toLowerCase();
      if (!entry) {
        el.innerHTML = `<span>${r.name}</span><span class="meta">unavailable</span>`;
        el.style.opacity = "0.5";
        return el;
      }
      const label = document.createElement("span");
      label.textContent = r.name;
      const end = document.createElement("span");
      end.className = "end";
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = fmtDist(entry.distance);
      const copyBtn = document.createElement("button");
      copyBtn.className = "copy";
      copyBtn.type = "button";
      copyBtn.textContent = "Copy";
      copyBtn.title = "Copy GPX file contents to clipboard";
      copyBtn.addEventListener("click", (e) => { e.stopPropagation(); copyRoute(entry, copyBtn); });
      end.append(meta, copyBtn);
      el.append(label, end);
      el.addEventListener("click", () => selectRoute(entry));
      entry.el = el;
      return el;
    }

    function buildCityRow(c, country) {
      const el = document.createElement("div");
      el.className = "route city";
      el.dataset.country = country;
      el.dataset.name = c.city.toLowerCase();
      const label = document.createElement("span");
      label.textContent = c.city;
      const end = document.createElement("span");
      end.className = "end";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "City";
      const copyBtn = document.createElement("button");
      copyBtn.className = "copy";
      copyBtn.type = "button";
      copyBtn.textContent = "Copy";
      copyBtn.title = "Copy coordinates to clipboard";
      copyBtn.addEventListener("click", (e) => { e.stopPropagation(); copyCoords(c, copyBtn); });
      end.append(tag, copyBtn);
      el.append(label, end);
      el.addEventListener("click", () => selectCity(c));
      c.el = el;
      return el;
    }

    // Render one list grouped by country, with each country's routes followed by
    // its large cities (cities show a "City" tag, routes show a distance).
    function buildSidebar() {
      countEl.textContent = cityStore.length
        ? `${store.length} routes \u00b7 ${cityStore.length} large cities`
        : `${store.length} routes across ${new Set(ROUTES.map((r) => r.country)).size} countries`;

      const countries = {};
      for (const r of ROUTES) {
        (countries[r.country] ||= { routes: [], cities: [] }).routes.push(r);
      }
      for (const c of cityStore) {
        (countries[c.country] ||= { routes: [], cities: [] }).cities.push(c);
      }

      for (const country of Object.keys(countries).sort()) {
        const head = document.createElement("div");
        head.className = "country";
        head.textContent = country;
        head.dataset.country = country;
        listEl.appendChild(head);
        for (const r of countries[country].routes) {
          listEl.appendChild(buildRouteRow(r, country));
        }
        for (const c of countries[country].cities.sort((a, b) => a.city.localeCompare(b.city))) {
          listEl.appendChild(buildCityRow(c, country));
        }
      }
    }

    filterEl.addEventListener("input", () => {
      const q = filterEl.value.trim().toLowerCase();
      document.querySelectorAll(".route").forEach((el) => {
        const hit = !q || el.dataset.name.includes(q) || el.dataset.country.toLowerCase().includes(q);
        el.classList.toggle("hidden", !hit);
      });
      // hide country headers with no visible routes
      document.querySelectorAll(".country").forEach((head) => {
        let sib = head.nextElementSibling, anyVisible = false;
        while (sib && sib.classList.contains("route")) {
          if (!sib.classList.contains("hidden")) { anyVisible = true; break; }
          sib = sib.nextElementSibling;
        }
        head.classList.toggle("hidden", !anyVisible);
      });
    });

    function showBanner(html) { bannerEl.innerHTML = html; bannerEl.style.display = "block"; }

    async function init() {
      const flat = ROUTES;
      const results = await Promise.allSettled(flat.map((r) => loadGpx(r)));

      let failures = 0;
      results.forEach((res, i) => {
        const r = flat[i];
        if (res.status === "fulfilled" && res.value.latlngs.length > 1) {
          const { latlngs, text, name, desc } = res.value;
          // Prefer the GPX metadata; fall back to the path-derived values.
          if (name) r.name = name;
          if (desc) r.country = desc;
          const line = L.polyline(latlngs, {
            color: cssVar("--track"), weight: 2, opacity: 0.55,
          }).addTo(map);
          const entry = {
            name: r.name, country: r.country, file: r.file, gpx: text,
            latlngs, line, markers: null, distance: routeDistance(latlngs),
          };
          line.on("click", () => selectRoute(entry, { pan: false }));
          store.push(entry);
        } else {
          failures++;
        }
      });

      // Load large cities from Large Cities.gpx and drop a marker for each.
      try {
        const cities = await loadCities();
        for (const c of cities) {
          const marker = L.circleMarker(c.coords, {
            radius: 5, color: "#fff", weight: 2,
            fillColor: cssVar("--city"), fillOpacity: 1,
          }).addTo(map);
          marker.bindTooltip(c.city);
          const entry = { ...c, marker };
          marker.on("click", () => selectCity(entry, { pan: false }));
          cityStore.push(entry);
        }
      } catch (e) { /* cities are optional — routes still render */ }

      buildSidebar();

      if (store.length === 0) {
        showBanner(
          "<b>No routes could be loaded.</b><br>" +
          "This page reads the <code>.gpx</code> files over HTTP, so it needs to be " +
          "served rather than opened directly from disk. Try:<br>" +
          "<code>python3 -m http.server</code> then open " +
          "<code>http://localhost:8000/</code> — or view it via GitHub Pages."
        );
        return;
      }
      if (failures > 0) {
        showBanner(`<b>${failures} route(s) failed to load.</b> The rest are shown below.`);
        setTimeout(() => { bannerEl.style.display = "none"; }, 6000);
      }

      const all = L.featureGroup([
        ...store.map((s) => s.line),
        ...cityStore.map((c) => c.marker),
      ]);
      map.fitBounds(all.getBounds(), { padding: [30, 30] });
    }

    init();
  </script>
</body>
</html>
