# Lints the source files the viewer is made of, and validates the GPX files it
# reads. Nothing here is built — the site is served as it sits in the
# repository — so package.json exists only to hold the linters and pin them.
# pnpm-lock.yaml pins them exactly, down to the integrity hash of every
# transitive package, which is why the versions are no longer written into the
# steps below.
#
# The rules live in the config files at the root: eslint.config.mjs,
# stylelint.config.mjs and .htmlvalidate.mjs. Each writes its rules out rather
# than extending a shared preset, so that a failure can be argued with in place
# and the set does not shift when a preset changes upstream.
name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm is not in the runner image, which ships only npm and Yarn. The
      # version comes from the packageManager field, so it cannot drift from
      # the one that wrote the lockfile.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Every linter runs even if an earlier one failed, so a red build reports
      # everything wrong at once rather than one thing per push.
      - name: JavaScript
        run: pnpm lint:js

      - name: CSS
        if: ${{ !cancelled() }}
        run: pnpm lint:css

      - name: HTML
        if: ${{ !cancelled() }}
        run: pnpm lint:html

      # Checks every GPX file is well-formed and really is GPX 1.1, against the
      # schema vendored at gpx.xsd. See validate-gpx.mjs for what it does not
      # reach.
      - name: XML
        if: ${{ !cancelled() }}
        run: pnpm lint:xml
