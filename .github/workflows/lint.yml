# Lints the three source files the viewer is made of. The repository has no
# package.json, no lockfile and no node_modules — nothing here is built — so
# each linter is fetched for the run and thrown away, and its version is pinned
# in the step that fetches it. The rules live in the config files at the root:
# eslint.config.mjs, stylelint.config.mjs and .htmlvalidate.mjs, each written
# out rather than extended from a preset, since there is nothing installed for
# an "extends" to resolve against.
name: Lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Every linter runs even if an earlier one failed, so a red build reports
      # everything wrong at once rather than one thing per push.
      - name: JavaScript
        run: npx --yes eslint@10.8.1 .

      - name: CSS
        if: ${{ !cancelled() }}
        run: npx --yes stylelint@17.14.1 "**/*.css"

      - name: HTML
        if: ${{ !cancelled() }}
        run: npx --yes html-validate@11.7.0 "**/*.html"
