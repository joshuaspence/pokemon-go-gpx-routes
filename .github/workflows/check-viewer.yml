name: Check viewer

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check ROUTE_FILES / WAYPOINT_FILES are in sync with the .gpx files
        run: python3 scripts/check_viewer.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check inline JavaScript syntax
        run: |
          python3 scripts/extract_inline_js.py > inline.js
          node --check inline.js
